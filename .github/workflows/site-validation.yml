name: Validate Google learning site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Check responsive themes, navigation and accessibility
        run: node tests/browser-check.mjs
      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-learning-screenshots
          path: artifacts/
          if-no-files-found: ignore

